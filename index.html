<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arapça Pre A1 · s.13</title>
<meta name="description" content="Arapça Pre A1 ders kitabı, 13. sayfa: etkileşimli örnek (harfleri dinle, dokun, alıştırmayı çöz).">
<meta name="theme-color" content="#1f5460">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preload" href="assets/013.webp" as="image">
<link rel="stylesheet" href="demo.css">
</head>
<body>
<header class="ust">
  <span class="ust-baslik">Arapça Pre A1 <i>·</i> s.13 <i>·</i> etkileşimli örnek</span>
</header>

<main class="yerlesim">
  <section class="sayfa-sutun">
    <div class="sayfa" id="sayfa">
      <img src="assets/013.webp" alt="Ders kitabı 13. sayfa: Arap harfleri" draggable="false" width="2889" height="4038">
      <div class="katman" id="katman"></div>
    </div>
  </section>

  <aside class="panel">
    <div class="kart kart-1" id="kart1">
      <div class="kart-bas"><span class="no">1</span> Harfleri dinle, tekrar et</div>
      <div class="oynatici">
        <button class="dugme ana" id="dinle" type="button" aria-label="Dinle"><svg viewBox="0 0 24 24" class="ik ik-oynat"><path d="M8 5v14l11-7z"/></svg><svg viewBox="0 0 24 24" class="ik ik-durdur"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg><span id="dinleYazi">Dinle</span></button>
        <button class="dugme" id="bastan" type="button" title="Baştan"><svg viewBox="0 0 24 24" class="ik"><path d="M6 5h2v14H6zM9.5 12 19 5v14z"/></svg><span>Baştan</span></button>
        <div class="hiz" role="group" aria-label="Hız">
          <button type="button" data-hiz="0.75">0,75×</button><button type="button" data-hiz="1" class="secili">1×</button>
        </div>
      </div>
      <label class="anahtar"><input type="checkbox" id="tekrarKip"><span class="kayar"></span><span>Sen tekrar et <small>(her harften sonra 2 sn sıra sende)</small></span></label>
      <div class="ilerleme"><div class="cubuk" id="cubuk"></div></div>
      <p class="ipucu">Bir harfe dokun, adını duy.</p>
    </div>

    <div class="kart kart-2" id="kart2">
      <div class="kart-bas"><span class="no mercan">2</span> Dinle, harfi seç <span class="puan" id="puan">0/6</span></div>
      <p class="ipucu">Maddenin numarasına dokun, dinle; sonra duyduğun harfin dairesine dokun.</p>
      <div class="dugmeler">
        <button class="dugme" id="kontrol" type="button">Kontrol et</button>
        <button class="dugme" id="goster" type="button" disabled>Cevapları göster</button>
        <button class="dugme" id="sifirla" type="button">Baştan</button>
      </div>
      <p class="mesaj" id="mesaj" aria-live="polite"></p>
    </div>
  </aside>
</main>

<div class="balon" id="balon" aria-hidden="true">
  <div class="balon-harf" id="balonHarf"></div>
  <div class="balon-ad" id="balonAd"></div>
  <div class="balon-alt"><span id="balonSira"></span><span class="sira-sende" id="siraSende">Sıra sende! <b class="sayac"></b></span></div>
</div>
<div class="kutlama" id="kutlama" aria-hidden="true"></div>

<script src="zaman.js"></script>
<script src="veri13.js"></script>
<script src="demo.js"></script>
</body>
</html>
